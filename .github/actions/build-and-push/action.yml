# Composite Action: Build and Push Docker Image
# Build Docker image con BuildKit caching y push a ECR

name: 'Build and Push Docker Image'
description: 'Build Docker image with caching and push to ECR'

inputs:
  context:
    description: 'Build context path'
    required: true
  image-name:
    description: 'Docker image name'
    required: true
  ecr-registry:
    description: 'ECR registry URL'
    required: true
  dockerfile:
    description: 'Path to Dockerfile'
    required: false
    default: 'Dockerfile'
  build-args:
    description: 'Build arguments (newline separated)'
    required: false
    default: ''

outputs:
  image-tag:
    description: 'Full image tag'
    value: ${{ steps.meta.outputs.tags }}
  image-digest:
    description: 'Image digest'
    value: ${{ steps.build.outputs.digest }}

runs:
  using: 'composite'
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ inputs.ecr-registry }}/${{ inputs.image-name }}
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-,format=short
          type=semver,pattern={{version}}
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push
      id: build
      uses: docker/build-push-action@v5
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.context }}/${{ inputs.dockerfile }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          BUILDKIT_INLINE_CACHE=1
          ${{ inputs.build-args }}

    - name: Build summary
      shell: bash
      run: |
        echo "### 🐳 Docker Build Complete" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Image:** ${{ inputs.image-name }}" >> $GITHUB_STEP_SUMMARY
        echo "**Tags:** ${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
        echo "**Digest:** ${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
        echo "**Size:** $(docker images ${{ inputs.ecr-registry }}/${{ inputs.image-name }}:${{ github.sha }} --format '{{.Size}}')" >> $GITHUB_STEP_SUMMARY
