# ArgoCD Project: Platform
# Proyecto para infraestructura del cluster (observability, monitoring, networking, security)

apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  labels:
    project: platform
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Platform infrastructure components (observability, monitoring, networking, security)

  # Repositorios permitidos
  sourceRepos:
    - 'https://github.com/fintech-company/gitops'
    - 'https://prometheus-community.github.io/helm-charts'
    - 'https://grafana.github.io/helm-charts'
    - 'https://open-telemetry.github.io/opentelemetry-helm-charts'
    - 'https://charts.jetstack.io'
    - 'https://kubernetes-sigs.github.io/gateway-api'
    - 'https://falcosecurity.github.io/charts'
    - 'https://open-policy-agent.github.io/gatekeeper/charts'

  # Clusters de destino
  destinations:
    - namespace: 'observability'
      server: https://kubernetes.default.svc
    - namespace: 'monitoring'
      server: https://kubernetes.default.svc
    - namespace: 'networking'
      server: https://kubernetes.default.svc
    - namespace: 'security'
      server: https://kubernetes.default.svc
    - namespace: 'kube-system'
      server: https://kubernetes.default.svc
    - namespace: 'gateway-system'
      server: https://kubernetes.default.svc
    - namespace: 'cert-manager'
      server: https://kubernetes.default.svc
    - namespace: 'falco'
      server: https://kubernetes.default.svc
    - namespace: 'gatekeeper-system'
      server: https://kubernetes.default.svc
    - namespace: 'velero'
      server: https://kubernetes.default.svc

  # Recursos permitidos (whitelist)
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'

  # Namespace resource whitelist
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'

  # Orphaned resources monitoring
  orphanedResources:
    warn: true
    ignore:
      - group: 'apps'
        kind: 'ReplicaSet'
      - group: 'apps'
        kind: 'ControllerRevision'

  # Roles específicos del proyecto
  roles:
    # Platform engineers tienen full access
    - name: platform-admin
      description: Platform administrators with full access
      policies:
        - p, proj:platform:platform-admin, applications, *, platform/*, allow
      groups:
        - platform-engineering-team

    # SREs pueden sincronizar
    - name: platform-operator
      description: Platform operators can sync and view
      policies:
        - p, proj:platform:platform-operator, applications, get, platform/*, allow
        - p, proj:platform:platform-operator, applications, sync, platform/*, allow
      groups:
        - sre-team

  # Sync windows (maintenance windows)
  syncWindows:
    # Permitir sync 24/7 en platform (alta prioridad)
    - kind: allow
      schedule: '* * * * *'
      duration: 24h
      applications:
        - '*'
      manualSync: true

  # Signature keys (para verificar commits firmados)
  # signatureKeys:
  #   - keyID: ABCD1234
