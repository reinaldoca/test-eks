# ArgoCD Application: OpenTelemetry Operator

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opentelemetry-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  labels:
    category: observability
spec:
  project: platform

  source:
    chart: opentelemetry-operator
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    targetRevision: 0.44.0
    helm:
      releaseName: opentelemetry-operator
      values: |
        # Manager configuration
        manager:
          replicas: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          # Habilitar auto-instrumentation
          autoInstrumentationImage:
            java: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java:latest
            nodejs: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-nodejs:latest
            python: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-python:latest
            dotnet: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-dotnet:latest

          # Metrics
          serviceMonitor:
            enabled: true

          # Pod security
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000

        # Admission webhooks (para auto-instrumentation injection)
        admissionWebhooks:
          create: true
          certManager:
            enabled: true

        # Kubeconfig
        kubeRBACProxy:
          enabled: true

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        maxDuration: 1m

  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle

  info:
    - name: 'Description'
      value: 'OpenTelemetry Operator for auto-instrumentation'
    - name: 'Documentation'
      value: 'https://opentelemetry.io/docs/k8s-operator/'
